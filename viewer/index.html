    <h1>财富先机报告 · 设计变量</h1>

    <section class="browser" aria-label="变量浏览器">
      <aside class="groups" id="groups" aria-label="变量分组"></aside>
      <div class="table-area"><div class="table-title" id="table-title"></div><div class="table-scroll"><table><thead><tr id="head-row"></tr></thead><tbody id="rows"></tbody></table></div></div>
    </section>

ng SC","fontStyle":"Semibold","fontSize":{"value":20,"unit":"px"},"lineHeight":{"unit":"AUTO"},"letterSpacing":{"unit":"PERCENT","value":0},"textCase":"ORIGINAL","textDecoration":"NONE","variableBindings":{"fontSize":{"collection":"Typography","name":"Size/Heading1"},"fontStyle":{"collection":"Typography","name":"Weight/SemiBold"}}},"heading2":{"figmaName":"二级标题","fontFamily":"PingFang SC","fontStyle":"Semibold","fontSize":{"value":16,"unit":"px"},"lineHeight":{"unit":"AUTO"},"letterSpacing":{"unit":"PERCENT","value":0},"textCase":"ORIGINAL","textDecoration":"NONE","variableBindings":{"fontSize":{"collection":"Typography","name":"Size/Heading2"},"fontStyle":{"collection":"Typography","name":"Weight/SemiBold"}}},"body":{"figmaName":"正文","fontFamily":"PingFang SC","fontStyle":"Regular","fontSize":{"value":14,"unit":"px"},"lineHeight":{"unit":"AUTO"},"letterSpacing":{"unit":"PERCENT","value":0},"textCase":"ORIGINAL","textDecoration":"NONE","variableBindings":{"fontSize":{"collection":"Typography","name":"Size/Body"},"fontStyle":{"collection":"Typography","name":"Weight/Regular"}}},"caption":{"figmaName":"辅助文字","fontFamily":"PingFang SC","fontStyle":"Regular","fontSize":{"value":12,"unit":"px"},"lineHeight":{"unit":"AUTO"},"letterSpacing":{"unit":"PERCENT","value":0},"textCase":"ORIGINAL","textDecoration":"NONE","variableBindings":{"fontSize":{"collection":"Typography","name":"Size/Caption"},"fontStyle":{"collection":"Typography","name":"Weight/Regular"}}}}},"manifest.json":{"source":"https://www.figma.com/design/946GZfDFpPwburJkuZy9mA","variableCount":51,"collectionCounts":{"Typography":8,"Dimensions":13,"Semantic Color":25,"Radius":5},"semanticColorModes":["indonesia","kenya"],"textStyleCount":4,"files":["typography.json","dimensions.json","semantic-color.indonesia.json","semantic-color.kenya.json","radius.json","text-styles.json"]}}</script>
  <script>
    (() => {
      const files = JSON.parse(document.getElementById('token-data').textContent);
      const manifest = files['manifest.json'];
      const categories = [
        ['Semantic Color', () => files['semantic-color.indonesia.json']],
        ['Radius', () => files['radius.json']],
        ['Dimensions', () => files['dimensions.json']],
        ['Typography', () => files['typography.json']],
        ['Text Styles', () => files['text-styles.json'].styles]
      ];
      const labels = { Radius:'圆角', Dimensions:'大小', Typography:'字体排印', Background:'背景', Text:'文本', Border:'边框', Overlay:'叠加' };
      const state = { category:'Semantic Color', group:'Text', mode:'both', query:'' };
      const metrics = document.getElementById('metrics');
      const tabs = document.getElementById('tabs');
      const groups = document.getElementById('groups');
      const rows = document.getElementById('rows');
      const head = document.getElementById('head-row');
      const title = document.getElementById('table-title');
      const make = (tag, cls, content) => { const el=document.createElement(tag); if(cls)el.className=cls; if(content!==undefined)el.textContent=String(content); return el; };
      function flatten(group, parents=[]) {
        return Object.entries(group).flatMap(([key,value]) => value && Object.hasOwn(value,'$value')
          ? [{path:[...parents,key].join('/'),name:key,group:parents[0]??'',token:value}]
          : flatten(value,[...parents,key]));
      }
      function metric(count,label) { const el=make('div','metric'); el.append(make('b','',count),make('span','',label)); metrics.append(el); }
      metric(manifest.variableCount,'变量总数');
      metric(manifest.collectionCounts['Semantic Color'],'语义颜色');
      metric(manifest.semanticColorModes.length,'国家模式');
      metric(manifest.textStyleCount,'文本样式');
      for(const [name] of categories) {
        const button=make('button','tab',`${name}${labels[name]?` · ${labels[name]}`:''}`);
        button.type='button';button.dataset.category=name;
        button.onclick=()=>{state.category=name;state.group='all';state.query='';document.getElementById('search').value='';render();};
        tabs.append(button);
      }
      document.getElementById('mode').onchange=event=>{state.mode=event.target.value;render();};
      document.getElementById('search').oninput=event=>{state.query=event.target.value.trim().toLocaleLowerCase();if(state.query)state.group='all';render();};
      function colorCell(token) {
        const value=token.$value, figma=token.$extensions?.figma, td=make('td'), row=make('div','value-row');
        const swatch=make('span','swatch'), inner=make('span','swatch-inner');
        inner.style.backgroundColor=`rgba(${value.components.map(x=>Math.round(x*255)).join(',')},${value.alpha})`;
        swatch.append(inner);
        const info=make('div');
        info.append(make('div','value-main',figma?.alias?.name??value.hex),make('div','value-sub',`${value.hex} · ${Math.round(value.alpha*10000)/100}%`));
        row.append(swatch,info);td.append(row);return td;
      }
      function plainCell(token) {
        const td=make('td'), value=token.$value;
        const label=token.$type==='dimension'?`${value.value} ${value.unit}`:token.$type==='fontWeight'?`${value} · ${token.$extensions?.figma?.figmaValue??''}`:value;
        td.append(make('div','value-main',label));return td;
      }
      function styleCell(style) {
        const td=make('td');
        td.append(make('div','value-main',`${style.fontFamily} · ${style.fontStyle} · ${style.fontSize.value}${style.fontSize.unit}`));
        const bindings=Object.entries(style.variableBindings??{}).map(([field,v])=>`${field}: ${v.name}`).join('；');
        td.append(make('div','value-sub',`行高 ${style.lineHeight.unit} · ${bindings}`));return td;
      }
      function renderGroups(data) {
        groups.replaceChildren(make('div','groups-title','分组'));
        const counts=state.category==='Text Styles'?[['all',Object.keys(data).length]]:[['all',flatten(data).length],...Object.entries(data).map(([name,value])=>[name,flatten(value).length])];
        for(const [name,count] of counts) {
          const button=make('button','group');button.type='button';button.dataset.group=name;
          button.setAttribute('aria-selected',String(name===state.group));
          button.append(make('span','',name==='all'?'全部':`${name}${labels[name]?` · ${labels[name]}`:''}`),make('span','group-count',count));
          button.onclick=()=>{state.group=name;render();};groups.append(button);
        }
      }
      function render() {
        for(const button of tabs.children)button.setAttribute('aria-selected',String(button.dataset.category===state.category));
        const data=categories.find(([name])=>name===state.category)[1]();renderGroups(data);
        const color=state.category==='Semantic Color', modes=color?(state.mode==='both'?['indonesia','kenya']:[state.mode]):[];
        head.replaceChildren(make('th','','Name'));
        if(color)for(const mode of modes)head.append(make('th','',mode==='indonesia'?'印尼 · Indonesia':'肯尼亚 · Kenya'));
        else head.append(make('th','','Value'));
        const entries=state.category==='Text Styles'?Object.entries(data).map(([key,style])=>({path:style.figmaName,name:style.figmaName,style,key})):flatten(data);
        const visible=entries.filter(entry=>(state.group==='all'||entry.group===state.group)&&`${entry.path} ${entry.token?.$extensions?.figma?.alias?.name??''}`.toLocaleLowerCase().includes(state.query));
        title.textContent=`${state.category}${state.group==='all'?'':` / ${state.group}`} · ${visible.length} 项`;
        rows.replaceChildren();
        const modeEntries=Object.fromEntries(modes.map(mode=>[mode,new Map(flatten(files[`semantic-color.${mode}.json`]).map(item=>[item.path,item.token]))]));
        for(const entry of visible) {
          const tr=make('tr'), name=make('td');
          name.append(make('div','name',entry.name));
          if(entry.path!==entry.name)name.append(make('div','sub',entry.path));
          if(entry.key)name.append(make('div','sub',`交付标识：${entry.key}`));
          tr.append(name);
          if(color)for(const mode of modes)tr.append(colorCell(modeEntries[mode].get(entry.path)));
          else tr.append(state.category==='Text Styles'?styleCell(entry.style):plainCell(entry.token));
          rows.append(tr);
        }
        if(!visible.length){const tr=make('tr'),td=make('td','empty','没有找到匹配的变量。');td.colSpan=color?modes.length+1:2;tr.append(td);rows.append(tr);}
      }
      render();
    })();
  </script>
